name: rom

# Builds a postmarketOS image for the X6525 out of the packages drafted in
# pmaports/, and uploads what you flash.
#
# It runs on arm64 on purpose: on x86_64 everything would go through qemu-user,
# and a kernel build under emulation takes hours rather than the ~45 minutes it
# takes natively. The Namespace profile this runs on is an arm64 host, which is
# why every job in this repository can ask for the same one; on an x86_64 host
# this workflow would still be correct, just far slower.
#
# `pmbootstrap init` asks its questions on stdin and cannot run unattended, so
# this writes the config file it would have written (the keys are the Config
# dataclass's fields) and points pmbootstrap at it with --config. The image's
# user password is x6525pmos; change it on first login.

on:
  workflow_dispatch:

jobs:
  rom:
    runs-on: namespace-profile-1
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Get pmbootstrap and pmaports, and add this port's packages
        run: |
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git /tmp/pmb
          pip install --break-system-packages -q /tmp/pmb
          pmbootstrap --version

          # edge, so device/testing/ exists - which is where these belong
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git /tmp/pmaports
          cp -r pmaports/device/testing/device-infinix-x6525 \
                pmaports/device/testing/linux-postmarketos-unisoc-ums9230 \
                pmaports/device/testing/u-boot-infinix-x6525 \
                pmaports/device/testing/firmware-infinix-x6525 \
                /tmp/pmaports/device/testing/
          ls /tmp/pmaports/device/testing/ | grep -E "x6525|ums9230"

      - name: Write the config init would have written
        run: |
          cat > /tmp/pmb.cfg <<'EOF'
          [pmbootstrap]
          device = infinix-x6525
          kernel = stable
          ui = console
          user = user
          hostname = x6525
          timezone = GMT
          locale = en_US.UTF-8
          ssh_keys = false
          jobs = 4
          work = /tmp/pmbwork
          EOF
          cat /tmp/pmb.cfg

      - name: Build kernel, U-Boot, rootfs and image
        run: |
          # init creates the work dir and its version marker; nothing else does,
          # and pmbootstrap refuses a work dir without one. Write what init
          # writes, taking the number from pmbootstrap itself so this does not
          # rot when it moves.
          mkdir -p /tmp/pmbwork
          python3 -c "import pmb.config; open('/tmp/pmbwork/version', 'w').write(f'{pmb.config.work_version}\n')"
          cat /tmp/pmbwork/version

          pmbootstrap -c /tmp/pmb.cfg --aports /tmp/pmaports -y --details-to-stdout \
            install --password x6525pmos

      - name: Export what to flash
        run: |
          pmbootstrap -c /tmp/pmb.cfg --aports /tmp/pmaports --details-to-stdout export

          # The export folder is convenience symlinks into the work directory,
          # which is not what should come out of an artifact: materialise them.
          # cp's default --sparse=auto keeps the rootfs image's holes, so this
          # does not write out four gigabytes of zeroes.
          mkdir -p /tmp/rom-out
          cp -rL /tmp/postmarketOS-export/. /tmp/rom-out/
          ls -la /tmp/rom-out/

      # No `if: always()`: on a failed build there is nothing to flash, and a
      # green upload step on a red run is how an empty artifact goes unnoticed.
      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: x6525-rom
          path: /tmp/rom-out/
          if-no-files-found: error
