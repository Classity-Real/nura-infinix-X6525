name: rom

# Builds a postmarketOS image for the X6525 out of the packages drafted in
# pmaports/, and uploads what you flash.
#
# It runs on arm64 on purpose: on x86_64 everything would go through qemu-user,
# and a kernel build under emulation takes hours rather than the ~45 minutes it
# takes natively.
#
# It also runs on the Namespace profile: the kernel builds there in about 10
# minutes instead of 43. Building the image needs loop devices, and without
# the privileged feature the container's device cgroup lets /dev/loop-control
# work while refusing to open the *block* device ("Operation not permitted").
# Namespace exposes that through the label itself:
#   ;container.privileged=true;container.host-pid-namespace=true
# The preflight step below still attaches, formats and detaches a loop device
# before the build, so a future runner change that loses the capability fails
# in seconds with a clear message instead of 20 minutes into the build.
# The profile itself must be an arm64 machine (an x86 profile would run the
# whole build under qemu-user, which is what the note above is about).
#
# The install is a split one (`pmbootstrap install --split`): pmbootstrap
# attaches the boot and root filesystem images whole, as two separate loop
# devices, instead of making a GPT disk image and formatting partitions of a
# loop device. That is what this device flashes anyway - `cache` and
# `userdata` each hold a filesystem, not a partition table - and it avoids
# the partition nodes a container without udev does not get. On the previous,
# unsplit build the node appeared (the preflight's own watcher made it from
# sysfs) but `mkfs.ext4 /dev/installp2` still failed with "No such device or
# address", i.e. the kernel had no live block device at that node's number.
#
# `pmbootstrap init` asks its questions on stdin and cannot run unattended, so
# this writes the config file it would have written (the keys are the Config
# dataclass's fields) and points pmbootstrap at it with --config. The image's
# user password is x6525pmos; change it on first login.

on:
  workflow_dispatch:

jobs:
  rom:
    # privileged + host PID namespace so losetup can open the loop block
    # device; the profile must be an arm64 machine (see the header).
    runs-on: "namespace-profile-1;container.privileged=true;container.host-pid-namespace=true"
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          # pmbootstrap checks the programs it needs on the host before it does
          # anything, and names whatever is missing: kpartx is what it stopped
          # on, on an image that carries git and python3 and little else.
          # modprobe and losetup (kmod, util-linux) are the loop-device work
          # install does, and ps (procps) is on pmbootstrap's own list.
          # e2fsprogs is for the preflight below, which formats a loop device
          # the way the install will.
          #
          # GitHub's ubuntu images have all of this preinstalled, which is why
          # this step did not exist until the runners changed.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs kpartx kmod util-linux procps

      - name: Loop devices
        run: |
          # Building the image means attaching the boot and root filesystem
          # images to loop devices, which pmbootstrap does from inside its
          # chroot with the host's /dev/loop* bind-mounted in. So the
          # capability this checks is the *runner's*, and it is worth ten
          # seconds here instead of twenty minutes into the build.
          #
          # losetup -f is not enough of a check. A container can be given the
          # nodes and answer that - it only needs the char device
          # /dev/loop-control - and still be refused the *block* device when it
          # comes to attaching, with Operation not permitted. So attach a file
          # and detach it again, which is the thing that has to work.
          #
          # There is a second failure mode on the Namespace runner even with
          # the privileged feature: the container has no udev, so device nodes
          # for loop devices are never created. pmbootstrap bind-mounts
          # whatever /dev/loop* it finds into its chroots and `losetup` opens
          # those nodes itself, so they have to exist up front.
          #
          # Then format the attached device, which is what `install --split`
          # does to each of its two images (see the header for why the split
          # install: the partition node of a partitioned loop device was the
          # thing that could not be opened here).
          sudo modprobe loop 2>&1 || echo "modprobe loop: not available"
          [ -e /dev/loop-control ] || sudo mknod -m 660 /dev/loop-control c 10 237 2>/dev/null || true
          for i in $(seq 0 7); do
            [ -e "/dev/loop$i" ] || sudo mknod -m 660 "/dev/loop$i" b 7 "$i" 2>/dev/null || true
          done
          truncate -s 16M /tmp/loop-test.img
          dev=$(sudo losetup --find --show --partscan /tmp/loop-test.img) || {
            echo "::error::this runner cannot attach loop devices, which building the image needs"
            exit 1
          }
          if ! sudo mkfs.ext4 -F -q -L loop-test "$dev"; then
            echo "::error::loop device attached but formatting it failed (see above)"
            sudo losetup -d "$dev" || true
            exit 1
          fi
          sudo losetup -d "$dev"
          echo "this runner can attach loop devices and format them"

      - name: Get pmbootstrap and pmaports, and add this port's packages
        run: |
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postMarketOS/pmbootstrap.git /tmp/pmb
          pip install --break-system-packages -q /tmp/pmb
          pmbootstrap --version

          # edge, so device/testing/ exists - which is where these belong
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postMarketOS/pmaports.git /tmp/pmaports
          cp -r pmaports/device/testing/device-infinix-x6525 \
                pmaports/device/testing/linux-postmarketos-unisoc-ums9230 \
                pmaports/device/testing/u-boot-infinix-x6525 \
                pmaports/device/testing/firmware-infinix-x6525 \
                /tmp/pmaports/device/testing/
          ls /tmp/pmaports/device/testing/ | grep -E "x6525|ums9230"

      - name: Write the config init would have written
        run: |
          cat > /tmp/pmb.cfg <<'EOF'
          [pmbootstrap]
          device = infinix-x6525
          kernel = stable
          # phosh: the GUI milestone. postmarketos-ui-phosh brings phosh and
          # phoc, greetd with the greetd-phrog greeter, and the on-screen
          # keyboard (phosh-osk-stub). The device package points the session
          # at the sprd-drm card (panel backlight and 2x scale); phoc picks
          # its renderer itself (GLES2 through panfrost when it works, else
          # pixman), so nothing pins WLR_RENDERER here.
          ui = phosh
          # Pin the init system: it must not change as a side effect of the UI
          # package's APKBUILD options. phosh defaults to systemd, and systemd
          # is what this port has been tested with.
          service_manager = systemd
          user = user
          hostname = x6525
          timezone = GMT
          locale = en_US.UTF-8
          ssh_keys = false
          boot_size = 512
          jobs = 4
          work = /tmp/pmbwork
          EOF
          cat /tmp/pmb.cfg

      - name: Build kernel, U-Boot, rootfs and image
        run: |
          # init creates the work dir and its version marker; nothing else does,
          # and pmbootstrap refuses a work dir without one. Write what init
          # writes, taking the number from pmbootstrap itself so this does not
          # rot when it moves.
          mkdir -p /tmp/pmbwork
          python3 -c "import pmb.config; open('/tmp/pmbwork/version', 'w').write(f'{pmb.config.work_version}\n')"
          cat /tmp/pmbwork/version

          # --split: two filesystem images, infinix-x6525-boot.img and
          # -root.img, each on its own whole loop device, rather than one
          # GPT disk image whose partitions have to be formatted. It is also
          # the shape of the artifact this device flashes (cache and userdata
          # each hold a filesystem). See the header.
          #
          # Two attempts. The fetch of the kernel tarball from codeberg failed
          # once with "ssl_client: SSL_read" / "wget: error getting response:
          # Network unreachable" four minutes in, which cost the whole job - and
          # the work directory is not recreated between attempts, so a retry
          # begins from what the first attempt left: a fetch failure then costs
          # the fetch rather than the kernel build that follows it.
          for attempt in 1 2; do
            echo "== attempt $attempt =="
            if pmbootstrap -c /tmp/pmb.cfg --aports /tmp/pmaports -y --details-to-stdout \
                 install --split --password x6525pmos; then
              exit 0
            fi
            echo "attempt $attempt failed"
          done
          echo "::error::the build failed twice"
          exit 1

      - name: Export what to flash
        run: |
          pmbootstrap -c /tmp/pmb.cfg --aports /tmp/pmaports --details-to-stdout export

          # The export folder is convenience symlinks into the work directory,
          # which is not what should come out of an artifact: materialise them.
          # cp's default --sparse=auto keeps the rootfs image's holes, so this
          # does not write out four gigabytes of zeroes.
          mkdir -p /tmp/rom-out
          cp -rL /tmp/postmarketOS-export/. /tmp/rom-out/

          # The split install's two images are the filesystems themselves:
          # pmOS_boot (extlinux.conf, kernel, initramfs, DTB) and pmOS_root.
          # They are exactly what goes into the eMMC's cache and userdata
          # partitions (FIRST_BOOT.md, "Flashing to the eMMC"), so give them
          # the names the docs use. Rename rather than copy: the root image is
          # gigabytes, and two names for the same bytes would double both the
          # artifact and the time spent uploading it.
          mv /tmp/rom-out/infinix-x6525-boot.img /tmp/rom-out/pmos-boot-fs.img
          mv /tmp/rom-out/infinix-x6525-root.img /tmp/rom-out/pmos-root-fs.img

          # boot_a gets U-Boot: the image must be a v4 Android boot image that fits
          # the 64 MiB partition. A warning rather than a failure, like the boot
          # filesystem check: it has not been run against a real pmbootstrap image yet,
          # and a false alarm should not cost the artifact.
          python3 -I tools/check-boot-img.py /tmp/rom-out/boot.img 64 \
            || echo "::warning::boot.img failed its sanity check (see above)"

          # A root filesystem that came out of the image build corrupted would
          # survive the upload unnoticed, and show as the "Inode N seems to
          # contain garbage" boot this port has already had once. Warn only.
          e2fsck -fn /tmp/rom-out/pmos-root-fs.img \
            || echo "::warning::pmos-root-fs.img does not pass a read-only fsck (see above)"

          # The boot filesystem comes out of the image at boot_size (512 MiB, the floor
          # pmbootstrap enforces) but holds ~50 MiB. Shrink it, with 8 MiB of slack, so it
          # fits the phone's 64 MiB cache partition (the one this is flashed into). resize2fs keeps
          # the UUID and label, which extlinux's pmos_boot_uuid depends on.
          B=/tmp/rom-out/pmos-boot-fs.img
          e2fsck -fy "$B" || [ $? -le 1 ]
          resize2fs -M "$B"
          bs=$(dumpe2fs -h "$B" 2>/dev/null | awk '/^Block size/{print $3}')
          bc=$(dumpe2fs -h "$B" 2>/dev/null | awk '/^Block count/{print $3}')
          bc=$((bc + 8 * 1048576 / bs))
          resize2fs "$B" "$bc"
          truncate -s $((bs * bc)) "$B"
          e2fsck -fn "$B"
          ls -l "$B"
          if [ $((bs * bc)) -gt $((64 * 1048576)) ]; then
            echo "::warning::pmos-boot-fs.img is $((bs * bc / 1048576)) MiB, more than the 64 MiB cache partition; flash it to another partition (FIRST_BOOT.md)"
          fi

          # What U-Boot's extlinux will ask the boot filesystem for must be there:
          # kernel, initramfs, and the device tree at fdtdir + the default fdtfile.
          # A warning rather than a failure, so the artifact is still uploaded to look at.
          python3 -I tools/check-boot-fs.py /tmp/rom-out/pmos-boot-fs.img \
            || echo "::warning::the boot filesystem does not hold what extlinux.conf names (see above)"
          ls -la /tmp/rom-out/

      # No `if: always()`: on a failed build there is nothing to flash, and a
      # green upload step on a red run is how an empty artifact goes unnoticed.
      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: x6525-rom
          path: /tmp/rom-out/
          if-no-files-found: error
