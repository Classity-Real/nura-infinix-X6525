name: firmware release

# Puts a versioned copy of the touch firmware on this repository's releases, so
# there is an immutable thing to point at besides the file in firmware/ that the
# package already fetches (pinned to a commit, so that one is immutable too).
#
# Nothing depends on this running: the firmware APKBUILD fetches the committed
# file, and the build workflow checks its hash against the package on every push.
# It runs only when a person presses "Run workflow" - never on a push - because
# creating a release is the owner's act, not a side effect of committing.
#
# Before publishing it checks the tarball three ways, so a bad one cannot go out:
# it must rebuild byte for byte from hdl_firmware_01.img, match the sha512 in the
# firmware APKBUILD, and pass tools/check-hdl-image.py.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to create"
        required: true
        default: "firmware-v1"

permissions:
  contents: write

jobs:
  release:
    runs-on: namespace-profile-1
    steps:
      - uses: actions/checkout@v4

      - name: Check the tarball is the image the package expects
        run: |
          cd firmware
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -cf - hdl_firmware_01.img | gzip -n -9 > /tmp/rebuilt.tar.gz
          cmp /tmp/rebuilt.tar.gz firmware-infinix-x6525-1.tar.gz
          echo "tarball rebuilds byte for byte from hdl_firmware_01.img"

          want=$(sed -n 's/^\([0-9a-f]\{128\}\)  .*/\1/p' \
            ../pmaports/device/testing/firmware-infinix-x6525/APKBUILD)
          got=$(sha512sum firmware-infinix-x6525-1.tar.gz | cut -d' ' -f1)
          [ "$want" = "$got" ] || {
            echo "tarball sha512 $got does not match the APKBUILD's $want"
            exit 1
          }
          echo "and matches the firmware APKBUILD sha512"

          python3 -I ../tools/check-hdl-image.py hdl_firmware_01.img | tail -1

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists here, nothing to do"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_REF_NAME" \
            --title "X6525 touch firmware (hdl_firmware_01.img)" \
            --notes "The OmniVision TCM HDL image the Infinix X6525's touch controller needs. The controller has no flash, so the driver downloads this after every reset.

          This is the image from the device itself (/vendor/firmware/hdl_firmware_01.img on the stock ROM): it is the one the stock module asks for, and it carries the DISPLAY area for this panel, which the images in the stock kernel tree do not.

          Packaged for pmaports as firmware-infinix-x6525. Hash and provenance: firmware/README.md." \
            firmware/firmware-infinix-x6525-1.tar.gz
          echo "published:"
          gh release view "$tag" --json assets -q '.assets[] | "  \(.url)"'
