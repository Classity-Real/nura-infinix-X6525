name: job-build

on:
  workflow_call:

env:
  KERNEL_REPO: https://codeberg.org/ums9230-mainline/linux
  KERNEL_TAG: v7.2-rc6-ums9230-0

jobs:
  build:
    runs-on: namespace-profile-pmos-smart
    timeout-minutes: 60
    steps:
      - name: Checkout the port
        uses: actions/checkout@v4
      - name: Checkout the kernel at ${{ env.KERNEL_TAG }}
        run: git clone --depth 1 --branch "$KERNEL_TAG" "$KERNEL_REPO" kernel
      - name: The kernel package carries the current patches and their checksums
        run: |
          K=pmaports/device/testing/linux-postmarketos-unisoc-ums9230
          fail=0
          for p in patches/upstream/0*.patch; do
            b=$(basename "$p")
            cmp -s "$p" "$K/$b" || { echo "STALE copy: $K/$b"; fail=1; }
            grep -qE "^$(sha512sum "$p" | cut -d' ' -f1)  $b\$" "$K/APKBUILD" ||
              { echo "BAD or missing sha512 in $K/APKBUILD: $b"; fail=1; }
            grep -qE "^[[:space:]]+$b\$" "$K/APKBUILD" ||
              { echo "not in source=: $b"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "kernel package matches patches/upstream"
      - name: No package's variables carry a checksum line
        run: |
          var() { ( . "$1"; eval "printf '%s\n' \"\${$2}\"" ); }
          fail=0
          for P in pmaports/device/testing/*/APKBUILD; do
            for v in depends makedepends options; do
              bad=$(var "$P" "$v" | tr ' ' '\n' | grep -E '^[0-9a-f]{128}$|\.patch$' || true)
              [ -z "$bad" ] || { echo "$P: $v carries: $(echo $bad)"; fail=1; }
            done
            bad=$(var "$P" source | tr ' ' '\n' | grep -E '^[0-9a-f]{128}$' || true)
            [ -z "$bad" ] || { echo "$P: source carries a checksum line"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo "no checksum lines among the packages' variables"
      - name: Verify the submission patches
        run: |
          base=$(git -C kernel rev-parse HEAD)
          git -C kernel -c user.name=ci -c user.email=ci@example.com \
            am --keep-non-patch "$PWD"/patches/upstream/0*.patch
          fail=0
          check() { diff -q "$1" "$2" >/dev/null || { echo "MISMATCH: $1 vs $2"; fail=1; }; }
          check kernel/arch/arm64/boot/dts/sprd/ums9230-infinix-x6525.dts dts/ums9230-infinix-x6525.dts
          check kernel/drivers/gpu/drm/panel/panel-td4160-hx.c drivers/panel-td4160-hx.c
          check kernel/drivers/input/touchscreen/ovt-tcm-spi.c drivers/ovt-tcm-spi.c
          check "kernel/Documentation/devicetree/bindings/display/panel/infinix,td4160-hx-panel.yaml" \
                "bindings/infinix,td4160-hx-panel.yaml"
          check "kernel/Documentation/devicetree/bindings/input/touchscreen/omnivision,tcm-spi.yaml" \
                "bindings/omnivision,tcm-spi.yaml"
          check kernel/drivers/power/supply/extcon-charger-detect.c drivers/extcon-charger-detect.c
          check "kernel/Documentation/devicetree/bindings/power/supply/linux,extcon-charger-detect.yaml" \
                "bindings/linux,extcon-charger-detect.yaml"
          for e in "drivers/gpu/drm/panel/Kconfig DRM_PANEL_TD4160_HX" \
                   "drivers/input/touchscreen/Kconfig TOUCHSCREEN_OVT_TCM_SPI" \
                   "drivers/input/touchscreen/Makefile TOUCHSCREEN_OVT_TCM_SPI" \
                   "drivers/power/supply/Kconfig CHARGER_EXTCON_DETECT" \
                   "drivers/power/supply/Makefile CHARGER_EXTCON_DETECT" \
                   "arch/arm64/boot/dts/sprd/Makefile ums9230-infinix-x6525.dtb" \
                   "Documentation/devicetree/bindings/arm/sprd/sprd.yaml infinix,x6525" \
                   "Documentation/devicetree/bindings/vendor-prefixes.yaml infinix"; do
            set -- $e
            grep -q "$2" "kernel/$1" || { echo "MISSING: $2 in $1"; fail=1; }
          done
          git -C kernel reset --hard -q "$base"
          git -C kernel clean -qfd
          [ "$fail" = 0 ] || exit 1
          echo "the submission series applies and matches the sources"
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang flex libelf-dev libssl-dev llvm lld python3-pip
      - name: Apply the overlay
        run: ./tools/apply-overlay.sh kernel
      - name: Build the device tree
        run: |
          make -C kernel ARCH=arm64 defconfig
          make -C kernel ARCH=arm64 -j"$(nproc)" sprd/ums9230-infinix-x6525.dtb ||
          make -C kernel ARCH=arm64 -j"$(nproc)" dtbs
          ls -l kernel/arch/arm64/boot/dts/sprd/ums9230-infinix-x6525.dtb
      - name: Validate the bindings and the board's own nodes
        run: |
          python3 -m pip install --quiet --break-system-packages dtschema || python3 -m pip install --quiet dtschema
          export PATH="$HOME/.local/bin:$PATH"
          dt-doc-validate --version
          cd kernel
          dt-doc-validate \
            Documentation/devicetree/bindings/display/panel/infinix,td4160-hx-panel.yaml \
            Documentation/devicetree/bindings/input/touchscreen/omnivision,tcm-spi.yaml \
            Documentation/devicetree/bindings/power/supply/linux,extcon-charger-detect.yaml
          dt-validate -s Documentation/devicetree/bindings \
            arch/arm64/boot/dts/sprd/ums9230-infinix-x6525.dtb > /tmp/dt-validate.txt 2>&1 || true
          BOARD="touchscreen@0|charger@6a|panel@0|speaker-amp|usb-charger-detect"
          BOARD="$BOARD|charger-en-hog|board-thermal|pa-thermal|chg-thermal"
          BOARD="$BOARD|fuel-gauge@c00|battery \(simple-battery\)"
          BOARD="$BOARD|tboard-thermistor|pa-thermistor|chg-thermistor"
          BOARD="$BOARD|proximity@29|vl53l0x"
          BOARD="$BOARD|camera@2d|s5k3l6|camera@10|ov8856"
          BOARD="$BOARD|bq24158|td4160|omnivision,|infinix,"
          if grep -qE "$BOARD" /tmp/dt-validate.txt; then
            echo "the board's own nodes did not validate:"
            grep -E "$BOARD" /tmp/dt-validate.txt
            exit 1
          fi
          echo "board nodes clean; $(grep -c . /tmp/dt-validate.txt) line(s) are the tree's own dtsi"
      - name: Enable the drivers, and check they survive olddefconfig
        run: |
          cd kernel
          ./scripts/config --module DRM_SPRD
          ./scripts/config --enable BACKLIGHT_CLASS_DEVICE
          ./scripts/config --module DRM_PANEL_TD4160_HX
          ./scripts/config --module TOUCHSCREEN_OVT_TCM_SPI
          ./scripts/config --module CHARGER_BQ2415X
          ./scripts/config --module CHARGER_EXTCON_DETECT
          ./scripts/config --module VL53L0X_I2C
          ./scripts/config --module SPI_SPRD_ADI
          ./scripts/config --module MFD_SC27XX_PMIC
          ./scripts/config --module REGULATOR_SC2730
          ./scripts/config --module SC27XX_ADC
          ./scripts/config --module GENERIC_ADC_THERMAL
          make ARCH=arm64 olddefconfig
          for sym in CONFIG_DRM_SPRD CONFIG_DRM_MIPI_DSI \
                     CONFIG_BACKLIGHT_CLASS_DEVICE CONFIG_DRM_PANEL_TD4160_HX \
                     CONFIG_TOUCHSCREEN_OVT_TCM_SPI CONFIG_CHARGER_BQ2415X \
                     CONFIG_CHARGER_EXTCON_DETECT CONFIG_SPI_SPRD_ADI \
                     CONFIG_MFD_SC27XX_PMIC CONFIG_REGULATOR_SC2730 \
                     CONFIG_SC27XX_ADC CONFIG_GENERIC_ADC_THERMAL \
                     CONFIG_VL53L0X_I2C; do
            grep -qE "^${sym}=(y|m)$" .config || { echo "$sym did not survive olddefconfig"; exit 1; }
          done
      - name: Prepare and build the drivers
        run: |
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" modules_prepare
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" drivers/gpu/drm/panel/panel-td4160-hx.o ||
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" M=drivers/gpu/drm/panel modules
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" drivers/input/touchscreen/ovt-tcm-spi.o ||
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" M=drivers/input/touchscreen modules
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" drivers/power/supply/extcon-charger-detect.o drivers/power/supply/bq2415x_charger.o ||
          make -C kernel ARCH=arm64 LLVM=1 -j"$(nproc)" M=drivers/power/supply modules
          ls -l kernel/drivers/gpu/drm/panel/panel-td4160-hx.o kernel/drivers/input/touchscreen/ovt-tcm-spi.o kernel/drivers/power/supply/extcon-charger-detect.o
      - name: Verify the package sources that have URLs
        run: |
          var() { ( . "$1"; eval "printf '%s\n' \"\${$2}\"" ); }
          sha() { sed -n 's/^\([0-9a-f]\{128\}\)  .*/\1/p' "$1" | sed -n "${2:-1}p"; }
          source_url() { var "$1" source | sed -n "${2:-1}p" | sed 's/^[ \t]*//; s/^[^:]*::\(.*\)$/\1/'; }
          fetch() { curl -sSLf -o /tmp/source.tar.gz "$1"; }
          compare() {
            got=$(sha512sum /tmp/source.tar.gz | cut -d' ' -f1)
            echo "$1"; echo "  want $2"; echo "  got  $got"
            [ "$got" = "$2" ] || { echo "  does not match the APKBUILD"; exit 1; }
          }
          check() { fetch "$1" && compare "$1" "$2"; }
          P="$GITHUB_WORKSPACE/pmaports/device/testing/u-boot-infinix-x6525/APKBUILD"
          check "$(var "$P" url)/archive/$(var "$P" _commit).tar.gz" "$(sha "$P")"
          P="$GITHUB_WORKSPACE/pmaports/device/testing/firmware-infinix-x6525/APKBUILD"
          url=$(source_url "$P")
          [ -n "$url" ] || { echo "firmware: no source= URL in $P"; exit 1; }
          if fetch "$url"; then compare "$url" "$(sha "$P")"; else echo "firmware: $url is not published yet"; fi
          i=2
          while :; do
            url=$(source_url "$P" "$i")
            [ -n "$url" ] || break
            check "$url" "$(sha "$P" "$i")"
            i=$((i + 1))
          done
      - name: Check the ROM's own kernel config takes our symbols
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE"/pmaports/device/testing/linux-postmarketos-unisoc-ums9230/config-postmarketos-unisoc-ums9230.aarch64 .config
          make ARCH=arm64 olddefconfig
          for sym in CONFIG_DRM_PANEL_TD4160_HX CONFIG_TOUCHSCREEN_OVT_TCM_SPI \
                     CONFIG_CHARGER_EXTCON_DETECT CONFIG_CHARGER_BQ2415X \
                     CONFIG_SERIAL_SPRD CONFIG_VL53L0X_I2C; do
            grep -qE "^${sym}=(y|m)$" .config || { echo "$sym did not survive olddefconfig in the ROM's kernel config"; exit 1; }
          done
          echo "the ROM's kernel config takes all six"
      - name: Upload what was built
        if: always()
        uses: namespace-actions/upload-artifact@v1
        with:
          name: x6525-build
          path: |
            kernel/arch/arm64/boot/dts/sprd/ums9230-infinix-x6525.dtb
            kernel/drivers/gpu/drm/panel/panel-td4160-hx.o
            kernel/drivers/input/touchscreen/ovt-tcm-spi.o
            kernel/drivers/power/supply/extcon-charger-detect.o
            kernel/.config
          if-no-files-found: warn
