name: Build PMOS

# Dispatcher: full job bodies live in job-*.yml (size limits on automated pushes).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "firmware release tag (only used by the firmware job)"
        required: false
        default: "firmware-v1"
      run_firmware:
        description: "also run the firmware release job"
        type: boolean
        default: false
      rom_only:
        description: "only build the postmarketOS ROM image (skip checks and uboot)"
        type: boolean
        default: false
      ui:
        description: "UI for the ROM: phosh = mobile UI (default), plasma-mobile = KDE, buffyboard = console"
        required: false
        type: choice
        default: "phosh"
        options:
          - phosh
          - plasma-mobile
          - buffyboard
      artifact:
        description: "What to upload from the ROM build"
        required: true
        type: choice
        default: "All"
        options:
          - "pmos-root-fs only"
          - "pmos-boot-fs only"
          - "boot only"
          - "All"
  push:
    paths:
      - "dts/**"
      - "drivers/**"
      - "bindings/**"
      - "patches/**"
      - "uboot/**"
      - "tools/**"
      - "pmaports/**"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  KERNEL_REPO: https://codeberg.org/ums9230-mainline/linux
  KERNEL_TAG: v7.2-rc6-ums9230-0

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rom_only != 'true' && github.event.inputs.rom_only != true)
    uses: ./.github/workflows/job-build.yml

  uboot:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rom_only != 'true' && github.event.inputs.rom_only != true)
    uses: ./.github/workflows/job-uboot.yml

  rom:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/job-rom.yml
    with:
      ui: ${{ inputs.ui || 'phosh' }}
      artifact: ${{ inputs.artifact }}

  firmware:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.run_firmware == 'true' || github.event.inputs.run_firmware == true)
    uses: ./.github/workflows/job-firmware.yml
    with:
      tag: ${{ inputs.tag || 'firmware-v1' }}
