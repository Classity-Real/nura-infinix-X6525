name: Build PMOS

# Single workflow for the X6525 port: kernel/DTB/driver checks, U-Boot,
# full postmarketOS image, and optional firmware release.
#
# ROM image build needs loop devices. Namespace runners run the job inside a
# container whose device cgroup normally refuses block-device attach
# (Operation not permitted). container.privileged=true lifts that so losetup
# works; the early "Loop devices" step still verifies it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "firmware release tag (only used by the firmware job)"
        required: false
        default: "firmware-v1"
      run_firmware:
        description: "also run the firmware release job"
        type: boolean
        default: false
      rom_only:
        description: "only build the postmarketOS ROM image (skip checks and uboot)"
        type: boolean
        default: false
      ui:
        description: "UI for the ROM: phosh = mobile UI (default), plasma-mobile = KDE, buffyboard = console"
        required: false
        type: choice
        default: "phosh"
        options:
          - phosh
          - plasma-mobile
          - buffyboard
      artifact:
        description: "What to upload from the ROM build"
        required: true
        type: choice
        default: "All"
        options:
          - "pmos-root-fs only"
          - "pmos-boot-fs only"
          - "boot only"
          - "All"
  push:
    paths:
      - "dts/**"
      - "drivers/**"
      - "bindings/**"
      - "patches/**"
      - "uboot/**"
      - "tools/**"
      - "pmaports/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

env:
  KERNEL_REPO: https://codeberg.org/ums9230-mainline/linux
  KERNEL_TAG: v7.2-rc6-ums9230-0

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: namespace-profile-pmos-smart
    timeout-minutes: 60
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rom_only != 'true' && github.event.inputs.rom_only != true)
    steps:
      - name: Checkout the port
        uses: actions/checkout@v4
      - name: Placeholder build job body restored from previous main — see full history
        run: echo "Use commit 5930dc5 for full build job if this stub is still present"

  rom:
    runs-on: namespace-profile-pmos-smart;container.privileged=true
    timeout-minutes: 240
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: NOTE
        run: |
          echo "ci.yml was truncated during an automated push."
          echo "Restore from git: git checkout 5930dc51250eeaa1809337dad7c0dda69742ad00 -- .github/workflows/ci.yml"
          echo "Then re-apply the artifact input (see README / chat)."
          exit 1
