name: Release ROM

# Downloads the x6525-rom artifact from a Build PMOS run, packs it into a
# single zip, and publishes that as a GitHub Release.
#
# Usage: Actions → Release ROM → Run workflow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must not already exist)"
        required: true
        type: string
      run_id:
        description: "Build PMOS workflow run ID (empty = latest successful with x6525-rom)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-rom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Build PMOS run ID
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            echo "Using provided run_id=$RUN_ID"
          else
            echo "Looking up latest successful Build PMOS run with x6525-rom..."
            RUN_ID=$(gh api \
              "repos/${GH_REPO}/actions/workflows/ci.yml/runs?status=completed&conclusion=success&per_page=20" \
              --jq '.workflow_runs[].id' | while read -r id; do
                if gh api "repos/${GH_REPO}/actions/runs/$id/artifacts" \
                     --jq '.artifacts[] | select(.name=="x6525-rom" and .expired==false) | .name' \
                     | grep -qx 'x6525-rom'; then
                  echo "$id"
                  break
                fi
              done)
            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful Build PMOS run with a non-expired x6525-rom artifact was found."
              echo "Run Build PMOS (workflow_dispatch) first, then retry Release ROM."
              exit 1
            fi
            echo "Selected run_id=$RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh api "repos/${GH_REPO}/actions/runs/$RUN_ID" \
            --jq '"run \(.id) \(.html_url) head_sha=\(.head_sha)"'

      - name: Download x6525-rom artifact
        uses: actions/download-artifact@v4
        with:
          name: x6525-rom
          path: rom-out
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}

      - name: Zip artifact
        run: |
          set -euo pipefail
          mkdir -p upload

          echo "Source files:"
          find rom-out -type f -printf '%p\t%s bytes\n' | sort
          test -n "$(find rom-out -type f | head -1)" || {
            echo "::error::Artifact downloaded but no files found"
            exit 1
          }

          echo "Creating x6525-rom.zip ..."
          (cd rom-out && zip -r -0 -q ../upload/x6525-rom.zip .)
          
          echo "Zip created successfully:"
          ls -lh upload/x6525-rom.zip

      - name: Create tagged release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          PRE="${{ inputs.prerelease }}"
          RUN_ID="${{ steps.run.outputs.run_id }}"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Delete it first or pick a new tag."
            exit 1
          fi

          mapfile -t FILES < <(find upload -type f | sort)
          echo "Uploading ${#FILES[@]} file(s) to tag $TAG"

          NOTES="postmarketOS image for Infinix X6525 (nura). Built by Build PMOS (run ${RUN_ID}). Download x6525-rom.zip and unzip it."

          if [ "$PRE" = "true" ]; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "ROM $TAG" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --prerelease \
              "${FILES[@]}"
          else
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "ROM $TAG" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              "${FILES[@]}"
          fi
          echo "Release: https://github.com/${GH_REPO}/releases/tag/$TAG"
